<!doctype html>
<html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screenshot To Code Verification Fixture</title>
<style>
:root{--accent:#175b69;--ink:#183542;--surface:#fff;--gap:24px}*{box-sizing:border-box}body{margin:0;background:#edf3f5;color:var(--ink);font-family:Arial,sans-serif;font-size:18px;line-height:1.8}header{background:#163746;color:white;padding:20px 32px;display:flex;justify-content:space-between;gap:16px}main{max-width:1120px;padding:32px;margin:auto}.layout{display:grid;grid-template-columns:240px 1fr;gap:var(--gap)}aside,article{background:var(--surface);padding:24px;border-radius:12px;box-shadow:0 5px 20px #1637460a}h1{font-size:30px;margin:0 0 16px}button{font:inherit;background:var(--accent);color:white;border:0;padding:8px 18px;border-radius:6px;cursor:pointer}button:focus-visible{outline:3px solid #d9a335;outline-offset:4px}bdi{font-size:16px}#answer{border-inline-start:4px solid var(--accent);padding-inline-start:16px}[hidden]{display:none!important}@media(max-width:700px){header{padding:16px;flex-wrap:wrap}main{padding:16px}.layout{grid-template-columns:1fr}h1{font-size:25px}}
</style>
<header><strong>مركز تعلُّم اللغات</strong><bdi dir="ltr">AR-20261026-001</bdi></header>
<main><div class="layout"><aside aria-label="فهرس الدرس">فهرس الدرس<p>١. التعريف<br>٢. الأمثلة<br>٣. التدريب</p></aside><article><h1>اللَّام القمريَّة</h1><p>نقرأ اللام بوضوح في كلمة «الْقَمَر».</p><button id="toggle" aria-controls="answer" aria-expanded="false">عرض المثال</button><p id="answer" hidden>الْقَمَرُ مُنِيرٌ</p></article></div></main>
<script>document.querySelector('#toggle').addEventListener('click',()=>{const b=document.querySelector('#toggle'),a=document.querySelector('#answer');a.hidden=!a.hidden;b.setAttribute('aria-expanded',String(!a.hidden));});</script>
</html>
