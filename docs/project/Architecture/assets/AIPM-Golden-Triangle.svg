<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1170" viewBox="0 0 1600 1170" role="img" aria-labelledby="t d">
<title id="t">AIPM Golden Triangle: Project Manager, Task Scope Contract, Resource Optimization</title>
<desc id="d">Every AIPM-managed task event flows through a lightweight Project Manager bootstrap, then Task Scope Contract and Resource Optimization are both activated and continuously enforced during specialist execution and quality verification. Shared Project State Manager is separate, PowerShell-only and opt-in.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081628"/><stop offset="1" stop-color="#142b46"/></linearGradient>
<linearGradient id="blue" x2="1" y2="1"><stop stop-color="#1c5ed3"/><stop offset="1" stop-color="#0c3469"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#7840c6"/><stop offset="1" stop-color="#43217a"/></linearGradient>
<linearGradient id="green" x2="1" y2="1"><stop stop-color="#0c957d"/><stop offset="1" stop-color="#0c584e"/></linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="10" refY="6" orient="auto"><path d="M 0 0 L 12 6 L 0 12 z" fill="#e8bd56"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif} .white{fill:#f6f8fc}.muted{fill:#adbed6}.tiny{font-size:23px}.small{font-size:27px}.medium{font-size:30px}.header{font-size:52px;font-weight:700}.title{font-size:37px;font-weight:700}.pill{fill:#183c60;stroke:#5f85ae;stroke-width:2} .line{fill:none;stroke:#e8bd56;stroke-width:7;stroke-linecap:round;stroke-linejoin:round} </style>
</defs>
<rect width="1600" height="1170" fill="url(#bg)" rx="32" />
<text x="800" y="80" text-anchor="middle" class="header white">AI Project Manager (AIPM)</text>
<text x="800" y="128" text-anchor="middle" class="medium muted">GOLDEN TRIANGLE • ALWAYS-ON MANAGEMENT POLICY</text>
<rect x="210" y="171" width="1180" height="84" rx="28" class="pill"/>
<text x="800" y="207" text-anchor="middle" class="small white" font-weight="700">TASK EVENT:  NEW  •  CONTINUE  •  RESUME  •  REVISE  •  REOPEN  •  FIX</text>
<text x="800" y="239" text-anchor="middle" class="tiny muted">All AIPM-managed task events, not only newly created tasks</text>
<path d="M800 270 L800 315" class="line" marker-end="url(#arrow)"/>
<rect x="479" y="330" width="642" height="163" rx="25" fill="url(#blue)" stroke="#70b1ff" stroke-width="3"/>
<text x="800" y="386" text-anchor="middle" class="title white">PROJECT MANAGER</text>
<text x="800" y="425" text-anchor="middle" class="small white">Mandatory first entry • Lightweight bootstrap</text>
<text x="800" y="461" text-anchor="middle" class="tiny muted">Governance • Routing • Supervision • Quality gates</text>
<path d="M 656 493 L 444 613" class="line" marker-end="url(#arrow)"/>
<path d="M 944 493 L 1156 613" class="line" marker-end="url(#arrow)"/>
<rect x="94" y="630" width="640" height="195" rx="24" fill="url(#green)" stroke="#7cf0d1" stroke-width="3"/>
<text x="414" y="683" text-anchor="middle" class="title white">RESOURCE OPTIMIZATION</text>
<text x="414" y="721" text-anchor="middle" class="small white">Left arm • Cost &amp; Efficiency</text>
<text x="414" y="762" text-anchor="middle" class="tiny muted">Tokens • Time • Tools • Usage limits</text>
<text x="414" y="792" text-anchor="middle" class="tiny muted">Adaptive budget • Sub-agent approval gate</text>
<rect x="866" y="630" width="640" height="195" rx="24" fill="url(#purple)" stroke="#c7a2ff" stroke-width="3"/>
<text x="1186" y="683" text-anchor="middle" class="title white">TASK SCOPE CONTRACT</text>
<text x="1186" y="721" text-anchor="middle" class="small white">Right arm • Scope &amp; Quality</text>
<text x="1186" y="762" text-anchor="middle" class="tiny muted">4-level inspection • Read tracking</text>
<text x="1186" y="792" text-anchor="middle" class="tiny muted">Bounded retries • Evidence-based verification</text>
<path d="M734 728 L866 728" class="line" marker-end="url(#arrow)"/><path d="M866 748 L734 748" class="line" marker-end="url(#arrow)"/>
<path d="M414 825 L414 878 L800 878" class="line"/><path d="M1186 825 L1186 878 L800 878" class="line"/><path d="M800 878 L800 913" class="line" marker-end="url(#arrow)"/>
<rect x="387" y="930" width="826" height="95" rx="22" fill="#213b57" stroke="#9bb8dc" stroke-width="2"/>
<text x="800" y="971" text-anchor="middle" class="medium white" font-weight="700">SPECIALIST EXECUTION + QUALITY VERIFICATION</text>
<text x="800" y="1003" text-anchor="middle" class="muted" style="font-size:20px">Three policies remain active; focused tests and truthful PASS / FAIL / UNVERIFIED</text>
<rect x="295" y="1051" width="1010" height="82" rx="16" fill="#0c2035" stroke="#536c83" stroke-dasharray="9 8" stroke-width="2"/>
<text x="800" y="1084" text-anchor="middle" class="small white">Shared Project State Manager — SEPARATE / OPT-IN</text>
<text x="800" y="1114" text-anchor="middle" class="tiny muted">Local PowerShell invocation only • Never auto-create workspace state</text>
</svg>